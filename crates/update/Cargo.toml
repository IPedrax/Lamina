[package]
name = "lamina-update"
description = "Lamina's updater: asks GitHub for a newer release, downloads its installer, checks it and puts it in place"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `testing::Fake`, a network that is a table of answers, for the desktop's tests too.
testing = []

[dependencies]
serde_json = { workspace = true }
# Release tags compared as versions (0.10.0 after 0.9.0).
semver = "1"
# HTTPS with rustls (ring and the Mozilla roots built in), the same ureq the assistant and the printer connection use. 3.5 at
# least: before it, a body of exactly the limit failed (`net.rs`).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# SHA-256 of the download, from the ring rustls already brings.
ring = "0.17"

[dev-dependencies]
# The parser's fuzz test uses the core's seeded generator; the core itself has no network and needs none.
lamina-core = { workspace = true }
