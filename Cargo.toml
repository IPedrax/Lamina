[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
lamina-core = { path = "crates/core" }
lamina-slicer = { path = "crates/slicer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same rules as BIMCraft: input is hostile, so nothing in the library may panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# The slicer is a hot loop; keep it fast in debug builds so tests and the viewport stay usable.
[profile.dev.package.lamina-slicer]
opt-level = 2
[profile.dev.package.lamina-core]
opt-level = 2
